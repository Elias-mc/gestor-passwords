name: Build downloads

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build download package
        run: npm run electron:download:${{ matrix.platform }}

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: gestor-passwords-${{ matrix.platform }}
          path: downloads/*.zip

  publish:
    name: Publish release downloads
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download ZIP artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: gestor-passwords-*
          path: downloads
          merge-multiple: true

      - name: Publish ZIPs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: downloads/*.zip
